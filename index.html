<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>numClick</title>
    <link rel="icon" type="image/png" href="pics/logo.png" />
    <link href="numClick.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <div id="game-wrapper">
      <div id="header-container">
        <img src="pics/logo.png" alt="NumClick Logo" id="header-logo" />
        <h1 id="title">numClick</h1>
        <div id="settings-trigger" onclick="game.toggleSettings()">⚙️</div>
      </div>

      <div id="setup-screen">
        <div class="setup-section">
          <h3>Game Type</h3>
          <div class="difficulty-options">
            <div class="radio-option selected" data-option="gameType">
              <input
                type="radio"
                name="gameType"
                id="normal"
                value="normal"
                checked
              />
              <label for="normal">Normal (01-64)</label>
            </div>
            <div class="radio-option" data-option="gameType">
              <input type="radio" name="gameType" id="expand" value="expand" />
              <label for="expand">Expand (01-128)</label>
            </div>
            <div class="radio-option" data-option="gameType">
              <input type="radio" name="gameType" id="insane" value="insane" />
              <label for="insane">Insane (100-999)</label>
            </div>
          </div>
        </div>

        <div class="setup-section">
          <h3>Select Sorting</h3>
          <div class="difficulty-options">
            <div class="radio-option selected" data-option="sortOrder">
              <input
                type="radio"
                name="sortOrder"
                id="ascending"
                value="ascending"
                checked
              />
              <label for="ascending">Ascending Sort</label>
            </div>
            <div class="radio-option" data-option="sortOrder">
              <input
                type="radio"
                name="sortOrder"
                id="descending"
                value="descending"
              />
              <label for="descending">Descending Sort</label>
            </div>
          </div>
        </div>

        <div class="setup-section">
          <h3>Click Feedback</h3>
          <div class="difficulty-options">
            <div class="radio-option selected" data-option="clickFeedback">
              <input
                type="radio"
                name="clickFeedback"
                id="enabled"
                value="enabled"
                checked
              />
              <label for="enabled">Color Enable</label>
            </div>
            <div class="radio-option" data-option="clickFeedback">
              <input
                type="radio"
                name="clickFeedback"
                id="disabled"
                value="disabled"
              />
              <label for="disabled">Color Disable</label>
            </div>
          </div>
        </div>

        <div class="setup-section">
          <h3>Timer Mode</h3>
          <div class="difficulty-options">
            <div class="radio-option selected" data-option="timerMode">
              <input
                type="radio"
                name="timerMode"
                id="normalTime"
                value="normal"
                checked
              />
              <label for="normalTime">⏱️ CountUp Timer</label>
            </div>
            <div class="radio-option" data-option="timerMode">
              <input
                type="radio"
                name="timerMode"
                id="countdown"
                value="countdown"
              />
              <label for="countdown">⏳ Countdown Timer</label>
            </div>
          </div>

          <div id="countdown-selector" style="display: none; margin-top: 15px">
            <label
              for="countdown-minutes"
              style="
                color: var(--text-main);
                display: block;
                margin-bottom: 10px;
                font-size: 0.75rem;
              "
            >
              Select Time Limit:
            </label>
            <input
              type="range"
              id="countdown-minutes"
              min="1"
              max="5"
              value="3"
            />
            <div
              style="
                display: flex;
                justify-content: space-between;
                margin-top: 8px;
              "
            >
              <span class="time-label" data-value="1">1 min</span>
              <span class="time-label" data-value="2">2 min</span>
              <span
                class="time-label"
                data-value="3"
                style="color: var(--accent); font-weight: 600"
                >3 min</span
              >
              <span class="time-label" data-value="4">4 min</span>
              <span class="time-label" data-value="5">5 min</span>
            </div>
          </div>
        </div>

        <button class="start-btn" onclick="game.startGame()">
          Start New Game
        </button>
      </div>

      <div id="game-screen" style="display: none">
        <div id="game-header">
          <div class="game-info-bar">
            <span>Mode: <strong id="mode-display">Normal</strong></span>
            <span>Sort: <strong id="sort-display">Ascending</strong></span>
            <span>Color: <strong id="click-display">Enabled</strong></span>
          </div>
        </div>

        <div id="game-container">
          <div id="stats-header">
            <div class="stat-pill" id="trophy-pill">
              <span class="icon">🏆</span>
              <span id="score">--:--</span>
            </div>
            <div class="stat-pill" id="clock-pill">
              <span class="icon">⏱️</span>
              <span id="watch">00:00</span>
            </div>
          </div>

          <div id="square-container"></div>

          <div id="control-buttons">
            <button
              id="new-game-btn"
              class="control-btn"
              onclick="game.backToSetup()"
            >
              Main Menu
            </button>
          </div>
        </div>
      </div>
    </div>

    <div id="settings-modal" style="display: none">
      <div class="modal-content settings-card">
        <div class="modal-header">
          <h2>Settings</h2>
          <span class="close-settings" onclick="game.toggleSettings()"
            >&times;</span
          >
        </div>

        <div class="setup-section">
          <h3>Appearance</h3>
          <div class="difficulty-options">
            <div
              class="radio-option"
              id="theme-light"
              onclick="game.setTheme('light', this)"
            >
              <input type="radio" name="theme_setting" />
              <label>Light</label>
            </div>
            <div
              class="radio-option"
              id="theme-dark"
              onclick="game.setTheme('dark', this)"
            >
              <input type="radio" name="theme_setting" />
              <label>Dark</label>
            </div>
            <div
              class="radio-option selected"
              id="theme-grey"
              onclick="game.setTheme('grey', this)"
            >
              <input type="radio" name="theme_setting" checked />
              <label>Grey</label>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="numClick.js"></script>
  </body>
</html>
